name: dh-security-bandit
description: "Static security analysis of Python sources with Bandit"
script: dh-security-bandit.py
filter:
  spec_fields: [source]
  kinds: [python, hydra, guardrail, openinference, ray, flower]
function:
  kind: python
  spec:
    python_version: PYTHON3_10
    requirements:
      - bandit
      - boto3
    source:
      lang: python
      handler: main
task:
  kind: python+job
  spec: {}
run:
  kind: python+job:run
  spec: {}
parameters_field: parameters