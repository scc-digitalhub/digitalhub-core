name: dh-security-trivy-sbom
description: "Container image SBOM analysis with Trivy"
script: dh-security-trivy-sbom.sh
function:
  kind: container
  metadata:
    description: Trivy operation to generate SBOM for container image.  
    labels:
      - security
      - container
  spec:
    image: aquasec/trivy:latest
    command: /shared/trivy.sh
    source:
      lang: sh
      source: trivy.sh
trigger:
  kind: lifecycle
  spec:
    key: "store://${project}/containerimage/container-image"
    states: [READY]
    task: container+job
    template:
      args: ["{{input.id}}"]