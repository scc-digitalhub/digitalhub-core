runtime:
  tvm:
    user-id: ${RUNTIME_TVM_USER_ID:${kubernetes.security.user}}
    group-id: ${RUNTIME_TVM_GROUP_ID:${kubernetes.security.group}}
    home-dir: ${RUNTIME_TVM_HOME_DIR:/shared}
    volume-size: ${RUNTIME_TVM_VOLUME_SIZE:4Gi}

    # format -> builder image for tvm+build (onnx, tflite).
    builders:
      onnx: ${RUNTIME_TVM_BUILDER_ONNX:ghcr.io/scc-digitalhub/tvm-toolkit:0.26.0}
      tflite: ${RUNTIME_TVM_BUILDER_TFLITE:ghcr.io/scc-digitalhub/tvm-toolkit:0.26.0}

    # image running compile_model.py for tvm+compile (IR -> model.so)
    compiler: ${RUNTIME_TVM_COMPILER:ghcr.io/scc-digitalhub/tvm-toolkit:0.26.0}

    # serve runtime -> serving image for tvm+serve, chosen with the task `serve_runtime`
    # (go by default). The .so Model is downloaded into it by an init container at deploy
    # time. Both images are multi-arch: one tag serves amd64, arm64 and arm/v7 nodes.
    # RUNTIME_TVM_SERVE, the single serve image of earlier versions, still sets the Go one.
    serve-images:
      go: ${RUNTIME_TVM_SERVE_GO:${RUNTIME_TVM_SERVE:ghcr.io/scc-digitalhub/tvm-runtime-go:0.26.0}}
      rust: ${RUNTIME_TVM_SERVE_RUST:ghcr.io/scc-digitalhub/tvm-runtime-rust:0.26.0}

    entrypoint: classpath:/runtime-tvm/scripts/entrypoint.sh
    builder-scripts:
      onnx: classpath:/runtime-tvm/scripts/build_onnx.py
      tflite: classpath:/runtime-tvm/scripts/build_tflite.py
